# Domains and per-document metadata for the corpus.
#
# Every indexed document gets a domain. Documents listed under `documents` (matched by
# file name) use the values given here. Any other file is classified automatically by
# comparing its opening text with the domain descriptions below, so new files work
# without editing this file. Add an entry when you want a nicer title or the automatic
# domain is wrong.

domains:
  ai_governance_law:
    label: "AI governance, law & regulation"
    description: >-
      Laws, regulations and frameworks: EU AI Act, GDPR data protection, personal data,
      AI risk management, generative AI risks, compliance obligations, regulators, NIST.
  finance_sec_filings:
    label: "Corporate finance (SEC 10-K filings)"
    description: >-
      Company annual reports and Form 10-K filings: revenue, net sales, net income, operating
      income, segments, risk factors, balance sheet, cash flow, shareholders, dividends,
      share repurchases, employees, fiscal year results.
  cloud_devops:
    label: "Cloud, infrastructure & DevOps"
    description: >-
      Cloud architecture and operations: AWS Well-Architected, performance efficiency,
      Kubernetes clusters, control plane, nodes, HTTP caching and web protocols, CI/CD,
      GitHub Actions workflows and runners.
  data_engineering:
    label: "Data engineering & databases"
    description: >-
      Data platforms and storage: Delta Lake transaction log, Apache Iceberg tables,
      Parquet and Arrow columnar formats, Spark SQL, streaming, Airflow DAGs and
      scheduling, PostgreSQL relational database.
  software_programming:
    label: "Software & programming"
    description: >-
      Programming languages and APIs: Python tutorial, type hints, pandas DataFrames,
      OpenAPI specification for HTTP APIs, code examples.
  german_immigration_law:
    label: "German immigration & student law"
    description: >-
      Residence law for international students in Germany: Aufenthaltsgesetz, § 16b AufenthG,
      Aufenthaltserlaubnis, visa, work permits, 140 days rule, health insurance (Krankenversicherung),
      financing studies, Studierendenwerk advice, Erasmus mobility.


[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-rag"
version = "3.0.0"
description = "Multi-domain, multilingual RAG with grounded answers, hybrid retrieval, semantic caching and cost-aware routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.6,<3",
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3.0,<7",
    "litellm>=1.50,<2",
    "streamlit>=1.38,<2",
    "pandas>=2.2,<4",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
    "pymupdf>=1.24,<2",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
rag-ingest = "semantic_rag.ingest:main"
rag-eval = "semantic_rag.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the real embedding/reranker models (downloads ~1.5 GB on first run)"]
